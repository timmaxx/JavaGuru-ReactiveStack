#version: '3.8'

# Hire is project-name.
name: java_guru_reactive_java_postgresql_db_album

services:
  db:
    image: postgres:16
    container_name: java_guru_reactive_java_postgresql_db_album
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=album
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
#HOST PORT:CONTAINER PORT
      - "15432:5432"
    restart: unless-stopped

volumes:
  db-data:
    name: "java_guru_reactive_java_postgresql_data_db_album"
    external: true
